<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristina Persaud - Professional Portfolio</title>
    <style>
        :root {
            --brand-scarlet: #cc0033;
            --brand-scarlet-alpha: rgba(204, 0, 51, 0.06);
            --brand-scarlet-bright: #ff1a53;
            --ink-dark: #0f172a;
            --ink-medium: #334155;
            --ink-muted: #64748b;
            --surface-canvas: #f8fafc;
            --surface-card: #ffffff;
            --radius-main: 16px;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--surface-canvas);
            color: var(--ink-medium);
            line-height: 1.7;
            padding-bottom: 80px;
        }

        /* PREMIUM GLASSMORPHIC NAVIGATION BAR */
        nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 18px 0;
        }

        .nav-container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 800;
            color: var(--ink-dark);
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-tab {
            background: none;
            border: none;
            color: var(--ink-muted);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            padding: 4px 0;
            position: relative;
        }

        .nav-tab:hover, .nav-tab.active {
            color: var(--brand-scarlet);
        }

        /* Animated underline indicator for the active view */
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--brand-scarlet);
            border-radius: 2px;
        }

        .container {
            max-width: 1040px;
            margin: 48px auto 0 auto;
            padding: 0 24px;
        }

        /* DYNAMIC PAGE PANEL VISIBILITY MECHANICS */
        .page-panel {
            display: none; /* Hidden by default */
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .page-panel.active {
            display: block; /* Visible when active */
            opacity: 1;
            transform: translateY(0);
        }

        /* PAGE 1: HOME PAGE HERO LAYOUT */
        header {
            background: var(--surface-card);
            border-radius: var(--radius-main);
            padding: 48px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05), 0 0 0 1px rgba(15, 23, 42, 0.04);
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 48px;
            align-items: center;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--brand-scarlet), var(--brand-scarlet-bright));
            border-top-left-radius: var(--radius-main);
            border-top-right-radius: var(--radius-main);
        }

        .profile-frame {
            width: 220px;
            height: 275px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 28px -8px rgba(15, 23, 42, 0.15);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--ink-dark);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .badge-strip {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .badge {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .badge-rutgers {
            background-color: var(--brand-scarlet-alpha);
            color: var(--brand-scarlet);
            border: 1px solid rgba(204, 0, 51, 0.15);
        }

        .rutgers-r-symbol {
            font-weight: 900;
            color: var(--brand-scarlet);
            background: #ffffff;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            text-align: center;
            line-height: 18px;
            font-size: 0.7rem;
        }

        .badge-cohn {
            background-color: #f1f5f9;
            color: var(--ink-dark);
            border: 1px solid #e2e8f0;
        }

        .personal-statement {
            font-size: 1.25rem;
            color: var(--ink-medium);
            margin-bottom: 32px;
            line-height: 1.65;
        }

        .cta-layout {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .button-ui {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .button-ui-primary {
            background: linear-gradient(135deg, var(--brand-scarlet) 0%, #a30026 100%);
            color: #ffffff;
            box-shadow: 0 8px 20px -6px rgba(204, 0, 51, 0.3);
        }

        .button-ui-primary:hover {
            transform: translateY(-2px);
        }

        .button-ui-secondary {
            background-color: #ffffff;
            color: var(--ink-dark);
            border: 1px solid #e2e8f0;
        }

        .button-ui-secondary:hover {
            background-color: #f8fafc;
            transform: translateY(-2px);
        }

        /* INNER HEADINGS STRUCTURES */
        h2 {
            font-size: 1.3rem;
            color: var(--ink-dark);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        h2::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, #e2e8f0 0%, transparent 100%);
        }

        /* PAGE 2: SKILLS MODULES LAYOUTS */
        .skills-container-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .skill-luxury-card {
            background: var(--surface-card);
            border: 1px solid #e2e8f0;
            padding: 24px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--ink-dark);
            font-size: 1rem;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.01);
        }

        .skill-luxury-card span {
            font-size: 1.3rem;
            background-color: var(--surface-canvas);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: var(--transition-smooth);
        }

        .skill-luxury-card:hover {
            border-color: var(--brand-scarlet);
            transform: translateY(-3px);
            box-shadow: 0 16px 24px -8px rgba(15, 23, 42, 0.04);
        }

        .skill-luxury-card:hover span {
            background-color: var(--brand-scarlet-alpha);
            color: var(--brand-scarlet);
        }

        /* PAGE 3: PROJECTS MODULES LAYOUTS */
        .timeline-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .timeline-card {
            background: var(--surface-card);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 36px;
            transition: var(--transition-smooth);
            position: relative;
        }

        .timeline-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: #cbd5e1;
            border-top-left-radius: 14px;
            border-bottom-left-radius: 14px;
            transition: var(--transition-smooth);
        }

        .timeline-card:hover::before {
            background-color: var(--brand-scarlet);
        }

        .timeline-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.03);
        }
